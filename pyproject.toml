[project]
name = "aap"
version = "0.1.0"
description = "Algorithmically augmented percussion: a Python composition engine driving Max/MSP from live electronic-drum input"
requires-python = ">=3.12"
dependencies = [
    "python-osc>=1.9",  # OSC transport to and from Max (design notes 4)
    "mido>=1.3",        # MIDI fixture input for deterministic testing (36)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff formats Python snippets inside Markdown. The design notes' code blocks are
# illustrative prose, not source — leave them exactly as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
